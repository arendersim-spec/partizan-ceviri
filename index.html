<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Partizan Sesi – Onay</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{--cream:#F4EFE5;--red:#B5121B;--black:#151515;--line:#ddd5c6;--mute:#777;--card:#fff}
*{box-sizing:border-box}
body{margin:0;background:var(--cream);color:var(--black);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif}
header{background:var(--black);color:#fff;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:5}
header b{letter-spacing:1px;font-size:15px}
header button{background:none;border:1px solid #666;color:#fff;border-radius:6px;padding:6px 10px;font-size:13px}
main{max-width:760px;margin:0 auto;padding:16px}
.hide{display:none!important}
.box{background:var(--card);border-radius:14px;padding:18px;margin-bottom:14px}
label{display:block;font-size:13px;font-weight:700;margin:12px 0 4px}
input[type=text],input[type=email],input[type=password],select{width:100%;padding:11px;border:1px solid var(--line);border-radius:8px;font-size:16px;background:#fff;color:var(--black)}
button{font:inherit;cursor:pointer}
.btn{border:0;border-radius:8px;padding:10px 14px;font-weight:700;font-size:14px;background:var(--black);color:#fff}
.btn.red{background:var(--red)}
.btn.ghost{background:#fff;color:var(--black);border:1px solid var(--line)}
.btn:disabled{opacity:.5}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px}
.tabs button{flex:0 0 auto;border:1px solid var(--line);background:#fff;border-radius:20px;padding:8px 14px;font-weight:700;font-size:14px;color:var(--black)}
.tabs button.on{background:var(--red);border-color:var(--red);color:#fff}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.bar select,.bar input{flex:1 1 150px;width:auto}
.item{background:var(--card);border-radius:14px;padding:14px;margin-bottom:10px;display:flex;gap:10px}
.item input[type=checkbox]{width:22px;height:22px;margin-top:2px;flex:0 0 auto;accent-color:var(--red)}
.item .body{flex:1;min-width:0}
.item h3{margin:0 0 4px;font-size:16px;line-height:1.3}
.meta{font-size:12px;color:var(--mute);font-weight:700;margin-bottom:6px}
.ex{font-size:14px;color:#555;margin:0 0 10px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.acts{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.acts select{flex:1 1 160px;width:auto;padding:9px;font-size:14px}
.src{display:flex;justify-content:space-between;align-items:center;background:#fff;border-radius:12px;padding:14px;margin-bottom:8px;gap:12px}
.src small{display:block;color:var(--mute)}
.src input{width:24px;height:24px;accent-color:var(--red)}
.note{font-size:13px;color:var(--mute)}
.item h3{cursor:pointer}
.full{font-size:14px;color:#333;white-space:pre-wrap;margin:0 0 10px;border-left:3px solid var(--red);padding-left:10px}
.full a{color:var(--red);font-weight:700}
.more{display:block;width:100%;margin:6px 0 30px}
.empty{text-align:center;color:var(--mute);padding:40px 10px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--black);color:#fff;padding:12px 18px;border-radius:10px;font-size:14px;max-width:90%;z-index:9}
#toast.err{background:var(--red)}
</style>
</head>
<body>
<header><b>PARTİZAN SESİ · ONAY</b><button id="logout" class="hide">Çıkış</button></header>
<main>

<section id="setup" class="box hide">
  <h2>İlk kurulum</h2>
  <p class="note">Bu iki bilgi bir kez girilir ve bu cihazda saklanır.</p>
  <label>Proje adresi (https://....supabase.co)</label>
  <input type="text" id="cfgUrl" autocapitalize="off" autocorrect="off">
  <label>Anahtar (eyJ... ya da sb_publishable_... ile başlar)</label>
  <input type="text" id="cfgKey" autocapitalize="off" autocorrect="off">
  <p><button class="btn red" id="cfgSave">Kaydet</button></p>
</section>

<section id="login" class="box hide">
  <h2>Giriş</h2>
  <label>E-posta</label><input type="email" id="email" autocapitalize="off">
  <label>Şifre</label><input type="password" id="pass">
  <p><button class="btn red" id="doLogin">Giriş yap</button>
  <button class="btn ghost" id="resetCfg">Kurulumu sıfırla</button></p>
</section>

<section id="app" class="hide">
  <div class="tabs">
    <button data-m="review" class="on">Bekleyen <span id="cnt"></span></button>
    <button data-m="published">Yayında</button>
    <button data-m="archived">Kaldırılan</button>
    <button data-m="sources">Kaynaklar</button>
  </div>
  <div id="listView">
    <div class="bar">
      <select id="fSrc"><option value="">Tüm kaynaklar</option></select>
      <select id="fCat"><option value="">Tüm kategoriler</option></select>
      <input type="text" id="fText" placeholder="Başlıkta ara">
      <button class="btn ghost" id="reload">Yenile</button>
    </div>
    <div class="bar">
      <button class="btn ghost" id="selAll">Tümünü seç</button>
      <button class="btn" id="bulkA"></button>
      <button class="btn red" id="bulkB"></button>
      <span class="note" id="selInfo"></span>
    </div>
    <div id="list"></div>
    <button class="btn ghost more hide" id="more">Daha fazla yükle</button>
  </div>
  <div id="srcView" class="hide">
    <p class="note">İşaretli kaynakların haberleri doğrudan yayınlanır. İşaretsiz kaynakların haberleri onayını bekler.</p>
    <div id="srcList"></div>
  </div>
</section>
</main>
<div id="toast" class="hide"></div>

<script>
const $ = id => document.getElementById(id);
const LABEL = {
  review:    {a:'Seçilenleri onayla', b:'Seçilenleri reddet', a1:'Onayla', b1:'Reddet', as:'published', bs:'archived'},
  published: {a:'', b:'Seçilenleri kaldır', a1:'', b1:'Kaldır', as:'', bs:'archived'},
  archived:  {a:'Seçilenleri yayına al', b:'', a1:'Yayına al', b1:'', as:'published', bs:''}
};
let sb = null, cats = [], srcs = [], srcName = {}, mode = 'review', rows = [], sel = new Set(), tmr = null, page = 0;
const PAGE = 100;
/* Uygulamada kullanılan bölümler, menüdeki sırayla. Diğerleri listelenmez. */
const CAT_ORDER = ['KÜRDİSTAN – TÜRKİYE','EMEK','KADIN','EKOLOJİ','EKONOMİ','BİLİM – TEKNOLOJİ','AVRUPA','DÜNYA','KÜLTÜR – SANAT','KURAM','YAZARLAR'];
let allCats = [];

function toast(msg, err) {
  const t = $('toast'); t.textContent = msg; t.className = err ? 'err' : '';
  clearTimeout(tmr); tmr = setTimeout(() => t.className = 'hide', err ? 6000 : 2500);
}
function show(id) { ['setup','login','app'].forEach(s => $(s).classList.toggle('hide', s !== id)); $('logout').classList.toggle('hide', id !== 'app'); }
function getCfg() { try { return JSON.parse(localStorage.getItem('ps_cfg') || 'null'); } catch (e) { return null; } }

async function start() {
  const cfg = getCfg();
  if (!cfg) return show('setup');
  try { sb = supabase.createClient(cfg.url, cfg.key); } catch (e) { toast('Kurulum bilgisi hatalı', true); return show('setup'); }
  const { data } = await sb.auth.getSession();
  if (!data || !data.session) return show('login');
  show('app'); await loadBase(); await load();
}

$('cfgSave').onclick = () => {
  const url = $('cfgUrl').value.trim().replace(/\/+$/, ''), key = $('cfgKey').value.trim();
  if (!/^https:\/\/.+\.supabase\.co$/.test(url) || key.length < 20) return toast('Adres ya da anahtar eksik görünüyor', true);
  try { localStorage.setItem('ps_cfg', JSON.stringify({ url, key })); } catch (e) {}
  start();
};
$('resetCfg').onclick = () => { try { localStorage.removeItem('ps_cfg'); } catch (e) {} show('setup'); };
$('doLogin').onclick = async () => {
  $('doLogin').disabled = true;
  const { error } = await sb.auth.signInWithPassword({ email: $('email').value.trim(), password: $('pass').value });
  $('doLogin').disabled = false;
  if (error) return toast('Giriş olmadı: ' + error.message, true);
  start();
};
$('logout').onclick = async () => { await sb.auth.signOut(); show('login'); };

async function loadBase() {
  const c = await sb.from('categories').select('id,name').order('name');
  const s = await sb.from('sources').select('id,name,is_trusted').order('name');
  if (c.error || s.error) return toast('Okuma hatası: ' + (c.error || s.error).message, true);
  allCats = c.data; srcs = s.data; srcName = {};
  cats = CAT_ORDER.map(n => allCats.find(x => x.name === n)).filter(Boolean);
  srcs.forEach(x => srcName[x.id] = x.name);
  const f = $('fSrc'); f.length = 1;
  [...new Set(srcs.map(x => x.name))].forEach(n => f.add(new Option(n, n)));
  const fc = $('fCat'); fc.length = 1;
  cats.forEach(c => fc.add(new Option(c.name, c.id)));
  fc.add(new Option('★ Öne çıkarılanlar', '__featured'));
}

async function load(append) {
  if (mode === 'sources') return renderSources();
  if (!append) { page = 0; rows = []; sel.clear(); $('list').innerHTML = '<div class="empty">Yükleniyor…</div>'; }
  let q = sb.from('articles')
    .select('id,title,excerpt,status,featured,published_at,created_at,primary_category_id,article_sources(source_id,source_url)')
    .eq('status', mode).order('created_at', { ascending: false })
    .range(page * PAGE, page * PAGE + PAGE - 1);
  const t = $('fText').value.trim();
  if (t) q = q.ilike('title', '%' + t + '%');
  const cat = $('fCat').value;
  if (cat === '__featured') q = q.eq('featured', true);
  else if (cat) q = q.eq('primary_category_id', cat);
  const { data, error } = await q;
  if (error) { if (!append) $('list').innerHTML = ''; return toast('Okuma hatası: ' + error.message, true); }
  rows = rows.concat(data.map(r => {
    const as = Array.isArray(r.article_sources) ? r.article_sources : (r.article_sources ? [r.article_sources] : []);
    r.source = as.length ? (srcName[as[0].source_id] || '') : '';
    r.url = as.length ? (as[0].source_url || '') : '';
    return r;
  }));
  $('more').classList.toggle('hide', data.length < PAGE);
  if (mode === 'review') {
    const c = await sb.from('articles').select('id', { count: 'exact', head: true }).eq('status', 'review');
    $('cnt').textContent = c.count != null ? '(' + c.count + ')' : '';
  }
  render();
}

async function toggleFull(r, box) {
  if (!box.classList.contains('hide')) { box.classList.add('hide'); return; }
  box.classList.remove('hide');
  if (box.dataset.ok) return;
  box.textContent = 'Yükleniyor…';
  const { data, error } = await sb.from('articles').select('body').eq('id', r.id).maybeSingle();
  if (error) { box.textContent = 'Metin okunamadı: ' + error.message; return; }
  box.textContent = (data && data.body) ? data.body : '(Metin yok)';
  if (/^https?:\/\//.test(r.url)) {
    const a = document.createElement('a'); a.href = r.url; a.target = '_blank'; a.rel = 'noopener';
    a.textContent = 'Kaynağında aç ↗';
    box.append(document.createElement('br'), document.createElement('br'), a);
  }
  box.dataset.ok = '1';
}

function visible() { const s = $('fSrc').value; return s ? rows.filter(r => r.source === s) : rows; }

function render() {
  const L = LABEL[mode], list = $('list'), vis = visible();
  $('bulkA').textContent = L.a; $('bulkA').classList.toggle('hide', !L.a);
  $('bulkB').textContent = L.b; $('bulkB').classList.toggle('hide', !L.b);
  list.innerHTML = '';
  if (!vis.length) { list.innerHTML = '<div class="empty">Burada haber yok.</div>'; updSel(); return; }
  vis.forEach(r => {
    const el = document.createElement('div'); el.className = 'item';
    const cb = document.createElement('input'); cb.type = 'checkbox'; cb.checked = sel.has(r.id);
    cb.onchange = () => { cb.checked ? sel.add(r.id) : sel.delete(r.id); updSel(); };
    const body = document.createElement('div'); body.className = 'body';
    const h = document.createElement('h3'); h.textContent = r.title || '(başlıksız)';
    const m = document.createElement('div'); m.className = 'meta';
    m.textContent = (r.source || 'Kaynak yok') + ' · ' + new Date(r.published_at || r.created_at).toLocaleString('tr-TR', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
    const ex = document.createElement('p'); ex.className = 'ex'; ex.textContent = r.excerpt || '';
    const full = document.createElement('div'); full.className = 'full hide';
    h.onclick = () => toggleFull(r, full);
    const acts = document.createElement('div'); acts.className = 'acts';
    const sl = document.createElement('select');
    cats.forEach(c => sl.add(new Option(c.name, c.id, false, c.id === r.primary_category_id)));
    if (!cats.some(c => c.id === r.primary_category_id)) {
      const old = allCats.find(c => c.id === r.primary_category_id);
      sl.add(new Option(old ? old.name + ' (eski)' : '(bölüm yok)', r.primary_category_id || '', true, true), 0);
    }
    sl.onchange = () => setCat(r, sl.value);
    acts.appendChild(sl);
    if (L.a1) { const b = document.createElement('button'); b.className = 'btn'; b.textContent = L.a1; b.onclick = () => setStatus([r.id], L.as); acts.appendChild(b); }
    if (L.b1) { const b = document.createElement('button'); b.className = 'btn red'; b.textContent = L.b1; b.onclick = () => setStatus([r.id], L.bs); acts.appendChild(b); }
    if (mode === 'published') {
      const f = document.createElement('button');
      const paint = () => { f.className = 'btn' + (r.featured ? '' : ' ghost'); f.textContent = r.featured ? '★ Öne çıkarıldı' : '☆ Öne çıkar'; };
      paint();
      f.onclick = async () => {
        const { data, error } = await sb.from('articles').update({ featured: !r.featured }).eq('id', r.id).select('id');
        if (error || !data.length) return toast('Değişmedi' + (error ? ': ' + error.message : ' (yetki yok)'), true);
        r.featured = !r.featured; paint();
        toast(r.featured ? 'GÜNCEL şeridinde öne alındı' : 'Öne çıkarma kaldırıldı');
      };
      acts.appendChild(f);
    }
    body.append(h, m, ex, full, acts); el.append(cb, body); list.appendChild(el);
  });
  updSel();
}
function updSel() { $('selInfo').textContent = sel.size ? sel.size + ' seçili' : visible().length + ' haber'; }

async function setCat(r, id) {
  const { data, error } = await sb.from('articles').update({ primary_category_id: id }).eq('id', r.id).select('id');
  if (error || !data.length) return toast('Kategori değişmedi' + (error ? ': ' + error.message : ' (yetki yok)'), true);
  r.primary_category_id = id; toast('Kategori değişti');
}

async function setStatus(ids, status) {
  if (!ids.length) return toast('Önce haber seç', true);
  const byId = {}; rows.forEach(r => byId[r.id] = r);
  const groups = status === 'published'
    ? [[ids.filter(i => byId[i].published_at), { status }], [ids.filter(i => !byId[i].published_at), { status, published_at: new Date().toISOString() }]]
    : [[ids, { status }]];
  let done = [];
  for (const [g, patch] of groups) {
    for (let i = 0; i < g.length; i += 50) {
      const { data, error } = await sb.from('articles').update(patch).in('id', g.slice(i, i + 50)).select('id');
      if (error) { toast('Hata: ' + error.message, true); break; }
      done = done.concat(data.map(d => d.id));
    }
  }
  const ok = new Set(done);
  rows = rows.filter(r => !ok.has(r.id)); done.forEach(i => sel.delete(i));
  if (done.length) toast(done.length + ' haber güncellendi'); else toast('Hiçbir haber değişmedi (yetki yok olabilir)', true);
  if (mode === 'review' && done.length) { const n = parseInt(($('cnt').textContent.match(/\d+/) || [0])[0], 10) - done.length; $('cnt').textContent = '(' + Math.max(n, 0) + ')'; }
  render();
}

function renderSources() {
  const box = $('srcList'); box.innerHTML = '';
  srcs.forEach(s => {
    const el = document.createElement('label'); el.className = 'src';
    const txt = document.createElement('div'); const b = document.createElement('b'); b.textContent = s.name;
    const sm = document.createElement('small'); sm.textContent = s.is_trusted ? 'Otomatik yayınlanır' : 'Onay bekler';
    txt.append(b, sm);
    const cb = document.createElement('input'); cb.type = 'checkbox'; cb.checked = s.is_trusted;
    cb.onchange = async () => {
      const { data, error } = await sb.from('sources').update({ is_trusted: cb.checked }).eq('id', s.id).select('id');
      if (error || !data.length) { cb.checked = !cb.checked; return toast('Değişmedi' + (error ? ': ' + error.message : ' (yetki yok)'), true); }
      s.is_trusted = cb.checked; sm.textContent = s.is_trusted ? 'Otomatik yayınlanır' : 'Onay bekler'; toast('Kaydedildi');
    };
    el.append(txt, cb); box.appendChild(el);
  });
}

document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => {
  mode = b.dataset.m;
  document.querySelectorAll('.tabs button').forEach(x => x.classList.toggle('on', x === b));
  $('listView').classList.toggle('hide', mode === 'sources');
  $('srcView').classList.toggle('hide', mode !== 'sources');
  load();
});
$('reload').onclick = () => load();
$('more').onclick = () => { page++; load(true); };
$('fCat').onchange = () => load();
$('fSrc').onchange = () => { sel.clear(); render(); };
$('fText').onkeydown = e => { if (e.key === 'Enter') load(); };
$('selAll').onclick = () => { const v = visible(); if (sel.size >= v.length) sel.clear(); else v.forEach(r => sel.add(r.id)); render(); };
$('bulkA').onclick = () => setStatus([...sel], LABEL[mode].as);
$('bulkB').onclick = () => setStatus([...sel], LABEL[mode].bs);

start();
</script>
</body>
</html>
